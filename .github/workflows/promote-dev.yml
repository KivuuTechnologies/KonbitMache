name: Promote Branch

on:
  push:
    branches:
      - dev
      - staging

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  create-promotion-pull-request:
    name: Create promotion pull request

    runs-on: ubuntu-latest

    steps:
      - name: Create pull request when one is not already open
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const targetBase = branch === 'dev' ? 'staging' : branch === 'staging' ? 'main' : null;

            if (!targetBase) {
              core.notice(`No promotion target defined for branch: ${branch}`);
              return;
            }

            const { data: openPullRequests } =
              await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base: targetBase,
                head: `${context.repo.owner}:${branch}`,
              });

            if (openPullRequests.length > 0) {
              core.notice(
                `Promotion pull request (${branch} -> ${targetBase}) already exists: ` +
                `#${openPullRequests[0].number}.`
              );
              return;
            }

            const { data: pullRequest } =
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: targetBase,
                head: branch,
                title: `chore: promote ${branch} to ${targetBase}`,
                body:
                  `Automated promotion pull request created ` +
                  `after changes reached \`${branch}\`.`,
              });

            core.notice(
              `Created promotion pull request #${pullRequest.number} (${branch} -> ${targetBase}).`
            );